<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сигнал — видеозвонки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12051f; --bg2:#1a0930; --panel:#211040; --panel2:#2b1656; --line:#452387;
  --text:#f3ecff; --mute:#a78fd6; --acid:#c8ff1f; --acid-ink:#14061f; --hi:#c8ff1f;
  --vio:#9d5cff; --vio-d:#6a2bd9; --danger:#ff4d8d; --bubble-in:#2b1656;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f0ff; --bg2:#ece1ff; --panel:#ffffff; --panel2:#f0e6ff; --line:#d3bcf7;
    --text:#240a45; --mute:#6a4ba0; --hi:#5b21d6; --bubble-in:#efe4ff;
  }
}
:root[data-theme="light"]{
  --bg:#f6f0ff; --bg2:#ece1ff; --panel:#ffffff; --panel2:#f0e6ff; --line:#d3bcf7;
  --text:#240a45; --mute:#6a4ba0; --hi:#5b21d6; --bubble-in:#efe4ff;
}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--text);font:400 15px/1.45 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
[hidden]{display:none!important}

/* shell */
#app{display:flex;height:100%}
#rail{width:216px;flex:none;background:var(--bg2);border-right:1.5px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font:800 20px var(--display);letter-spacing:-.02em}
.logo{display:flex;align-items:flex-end;gap:3px;height:24px}
.logo i{display:block;width:6px;border-radius:3px;background:var(--acid)}
.logo i:nth-child(1){height:10px}.logo i:nth-child(2){height:20px;background:var(--vio)}.logo i:nth-child(3){height:15px}.logo i:nth-child(4){height:24px;background:var(--vio)}
#rail nav{display:flex;flex-direction:column;gap:4px}
#rail nav button,.mechip{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--mute);font-weight:500;position:relative;text-align:left}
#rail nav button:hover{background:var(--panel2);color:var(--text)}
#rail nav button.on{background:var(--acid);color:var(--acid-ink);font-weight:700}
.badge{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px;font-style:normal;font-weight:700}
.mechip{margin-top:auto;background:var(--panel);border:1.5px solid var(--line);color:var(--text)}
.mechip .who{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.mechip .who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mechip .who span{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view{flex:1;min-width:0;overflow:auto;position:relative}
@media (max-width:760px){
  #app{flex-direction:column-reverse}
  #rail{width:auto;flex-direction:row;padding:6px 8px;border-right:0;border-top:1.5px solid var(--line);gap:0;justify-content:center}
  .brand,.mechip{display:none}
  #rail nav{flex-direction:row;width:100%;justify-content:space-around}
  #rail nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 12px;border-radius:12px}
  .badge{right:6px;top:2px;transform:none}
}

/* atoms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:11px 18px;border-radius:14px;background:var(--acid);color:var(--acid-ink);font-weight:700;border:2px solid var(--acid);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--vio)}
.btn.vio{background:var(--vio-d);border-color:var(--vio-d);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.xl{padding:18px 28px;font:800 17px var(--display);border-radius:18px}
.btn.sm{padding:7px 12px;border-radius:11px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:22px}
input[type=text],input[type=search],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:13px;padding:11px 14px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--vio)}
textarea{resize:vertical;min-height:90px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input[type=range]{accent-color:var(--acid);width:100%;padding:0;border:0;background:none}
input[type=color]{width:48px;height:38px;padding:2px;border-radius:10px;background:var(--bg);border:1.5px solid var(--line)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;color:var(--mute);font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;cursor:pointer}
.sw input{appearance:none;width:46px;height:26px;border-radius:13px;background:var(--panel2);border:1.5px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.sw input:checked{background:var(--acid);border-color:var(--acid)}
.sw input:checked::after{transform:translateX(20px);background:var(--acid-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;font-weight:800}
.mute{color:var(--mute)}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--vio-d),var(--vio));color:var(--acid);font:800 16px var(--display);overflow:hidden;flex:none;user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:32px;height:32px;font-size:13px}.av.lg{width:56px;height:56px;font-size:22px}.av.xl{width:96px;height:96px;font-size:36px}.av.xxl{width:128px;height:128px;font-size:48px;border:4px solid var(--bg)}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;padding:44px 40px;max-width:1240px;margin:0 auto;align-items:center;min-height:100%}
.hero h1{font-size:clamp(38px,5.6vw,76px);line-height:.98;margin-bottom:18px}
.hero h1 span{display:block;color:var(--hi)}
.lead{font-size:18px;color:var(--mute);max-width:44ch;margin-bottom:28px}
.joinrow{display:flex;gap:10px;margin-top:16px;max-width:460px}
.joinrow input{font:700 18px var(--display);letter-spacing:.06em;text-transform:lowercase}
.recent{margin-top:32px}.recent h3{font-size:14px;margin-bottom:10px;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);margin:0 8px 8px 0;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--acid)}
.pvcard{padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 2px var(--vio-d),0 30px 80px -20px rgba(157,92,255,.5)}
.pvbox{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0a0214;width:100%}
.pvbox video{width:100%;height:100%;object-fit:contain;display:block}
.mir{transform:scaleX(-1)}
.pvbox .pv-empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#a78fd6;text-align:center;padding:16px;font-size:14px}
.pvbox.empty .pv-empty{display:flex}.pvbox.empty video{visibility:hidden}
.pv-empty svg{width:34px;height:34px}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--vio),var(--acid));transition:width .08s}
@media (max-width:900px){.home{grid-template-columns:1fr;padding:24px 18px;gap:24px}}

/* modal/toast */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,2,20,.72);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:min(920px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1.5px solid var(--line);border-radius:24px;padding:22px;position:relative}
.sheet.narrow{width:min(480px,100%)}
.sheet .x{position:absolute;right:14px;top:14px}
.sheet h2{font-size:22px;margin-bottom:14px;padding-right:44px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(520px,calc(100% - 24px));pointer-events:none}
.toast{background:var(--acid);color:var(--acid-ink);padding:11px 16px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:auto;max-width:100%}
.toast.err{background:var(--danger);color:#fff}
#banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:110;width:min(460px,calc(100% - 24px))}
.callban{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--acid);border-radius:18px;padding:12px;box-shadow:0 0 30px rgba(200,255,31,.35);margin-bottom:8px}
.callban .t{flex:1;min-width:0}.callban b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* settings */
.stabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.stabs button{padding:9px 16px;border-radius:12px;border:1.5px solid var(--line);color:var(--mute);font-weight:600}
.stabs button.on{background:var(--acid);border-color:var(--acid);color:var(--acid-ink)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
.split .sticky{position:sticky;top:0}
@media (max-width:760px){.split{grid-template-columns:1fr}.split .sticky{position:static}}
.stack{display:flex;flex-direction:column;gap:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);font-weight:600}
.seg button.on{background:var(--vio-d);border-color:var(--vio);color:#fff}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bgt{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:2.5px solid var(--line);background:var(--bg);padding:0}
.bgt img,.bgt video{width:100%;height:100%;object-fit:cover;display:block}
.bgt.on{border-color:var(--acid);box-shadow:0 0 0 2px rgba(200,255,31,.35)}
.bgt .del{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:rgba(10,2,20,.8);color:#fff;display:grid;place-items:center}
.bgt.add{display:grid;place-items:center;border-style:dashed;color:var(--hi);font-weight:600;font-size:13px;gap:4px;text-align:center}
.note{font-size:13px;color:var(--mute);background:var(--bg);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;color:var(--mute);font-size:13px;font-weight:500}
.hd b{color:var(--text);font-variant-numeric:tabular-nums}

/* chats */
.chats{display:grid;grid-template-columns:340px minmax(0,1fr);height:100%}
.cl{border-right:1.5px solid var(--line);display:flex;flex-direction:column;min-height:0}
.cl .top{padding:16px;display:flex;flex-direction:column;gap:10px}
.cl h2{font-size:22px}
.list{overflow:auto;flex:1;min-height:0;padding:0 8px 8px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;width:100%;text-align:left}
.item:hover,.item.on{background:var(--panel2)}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.item .mid b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid span{color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item time{font-size:12px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acid);flex:none}
.empty{padding:36px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--text);font:800 18px var(--display);margin-bottom:8px}
.conv{display:flex;flex-direction:column;min-height:0;min-width:0}
.conv .head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1.5px solid var(--line)}
.conv .head .mid{flex:1;min-width:0;line-height:1.2}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:0}
.m{max-width:min(78%,520px);padding:9px 13px;border-radius:18px;background:var(--bubble-in);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--acid);color:var(--acid-ink)}
.m time{display:block;font-size:11px;opacity:.65;text-align:right;margin-top:2px}
.voice{display:flex;align-items:center;gap:10px;min-width:220px;white-space:normal}
.voice .pl{width:38px;height:38px;border-radius:50%;background:var(--vio-d);color:#fff;display:grid;place-items:center;flex:none}
.m.me .voice .pl{background:var(--acid-ink);color:var(--acid)}
.wave{display:flex;align-items:center;gap:2px;height:30px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.3}
.wave i.on{opacity:1}
.callcard{display:flex;align-items:center;gap:12px;white-space:normal}
.callcard .ci{width:40px;height:40px;border-radius:50%;background:var(--vio-d);color:var(--acid);display:grid;place-items:center;flex:none}
.composer{display:flex;gap:8px;padding:12px;border-top:1.5px solid var(--line);align-items:center}
.composer input{flex:1}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--panel2);border:1.5px solid var(--line)}
.round.acid{background:var(--acid);border-color:var(--acid);color:var(--acid-ink)}
.rec{flex:1;display:flex;align-items:center;gap:12px}
.rec .rd{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
.rec .wave{height:36px;color:var(--hi)}.rec .wave i{opacity:1}
@keyframes blink{50%{opacity:.25}}
.conv .none{flex:1;display:grid;place-items:center}
.back{display:none}
@media (max-width:760px){
  .chats{grid-template-columns:1fr;position:relative}
  .chats .conv{position:absolute;inset:0;background:var(--bg);display:none}
  .chats.open .conv{display:flex}
  .back{display:grid}
  .cl{border-right:0}
}

/* profile */
.prof{max-width:860px;margin:0 auto;padding:20px}
.banner{height:220px;border-radius:26px;background:linear-gradient(120deg,var(--vio-d),#2a0a5c 45%,#5a7a00 100%) center/cover;border:1.5px solid var(--line)}
.phead{display:flex;gap:18px;align-items:flex-end;margin:-52px 22px 0;flex-wrap:wrap}
.phead .mid{flex:1;min-width:200px;padding-bottom:6px}
.phead h2{font-size:26px;line-height:1.1}
.un{color:var(--hi);font-weight:700}
.bio{margin:18px 22px;white-space:pre-wrap;max-width:64ch}
.edit{margin:14px 0 0;padding:22px}
.upl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ok{color:var(--hi);font-size:13px;font-weight:600}.bad{color:var(--danger);font-size:13px;font-weight:600}
@media (max-width:600px){.banner{height:150px}.av.xxl{width:96px;height:96px;font-size:36px}.phead{margin:-40px 8px 0}}

/* lobby + call: always dark */
#callroot{position:fixed;inset:0;z-index:50;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  --bg:#0d0417;--bg2:#160828;--panel:#1c0b36;--panel2:#291351;--line:#452387;--text:#f3ecff;--mute:#a78fd6;--hi:#c8ff1f;--bubble-in:#291351;
  background:radial-gradient(1100px 560px at 85% -10%,#3b1580 0,transparent 60%),var(--bg);color:var(--text)}
.lobby{height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;padding:32px;max-width:1180px;margin:0 auto;align-items:center}
.lobby h2{font-size:30px;margin-bottom:6px}
.lobby .pvbox{box-shadow:0 0 0 2px var(--vio-d),0 30px 80px -20px rgba(157,92,255,.6)}
.pvtools{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:10px}
.codebig{font:800 34px var(--display);letter-spacing:.08em;color:var(--acid)}
@media (max-width:860px){.lobby{grid-template-columns:1fr;padding:16px}}
.call{height:100%;display:flex;flex-direction:column;position:relative}
.ctop{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.ctop .code{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--mute)}
.ctop .code b{font:800 16px var(--display);color:var(--acid);letter-spacing:.06em}
.ctop .sp{flex:1}
.cbody{flex:1;min-height:0;display:flex;gap:10px;padding:0 10px;position:relative}
.grid{flex:1;min-width:0;display:grid;gap:10px;grid-auto-rows:1fr;align-content:stretch}
.tile{position:relative;background:var(--panel);border-radius:18px;overflow:hidden;border:2px solid var(--line);min-height:0;min-width:0}
.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#0a0214}
.tile.sc video{object-fit:contain}
.tile.nocam video{visibility:hidden}
.tav{position:absolute;inset:0;display:none;place-items:center}
.tile.nocam .tav{display:grid}
.tile.speak{border-color:var(--acid);box-shadow:0 0 0 3px rgba(200,255,31,.22),0 0 34px rgba(200,255,31,.4)}
.tinfo{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:rgba(13,4,23,.72);padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;max-width:calc(100% - 20px)}
.tinfo .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tinfo .tmic{display:none;color:var(--danger)}.tinfo .tmic svg{width:15px;height:15px}
.tile.muted .tmic{display:inline-flex}
.thand{display:none}.tile.hand .thand{display:inline}
.tile.conn::after{content:"Подключаем…";position:absolute;top:10px;right:10px;background:rgba(13,4,23,.72);color:var(--acid);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.side{width:320px;flex:none;background:var(--panel);border:1.5px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0}
.side .sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1.5px solid var(--line);font:800 15px var(--display)}
.side .sb{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.side .sf{display:flex;gap:8px;padding:10px;border-top:1.5px solid var(--line)}
.cm{background:var(--bubble-in);padding:8px 12px;border-radius:14px;word-break:break-word;white-space:pre-wrap}
.cm b{display:block;font-size:12px;color:var(--hi)}
.cm.me{background:var(--acid);color:var(--acid-ink)}.cm.me b{color:var(--acid-ink);opacity:.7}
@media (max-width:760px){.side{position:absolute;inset:0 10px 0 10px;width:auto;z-index:5}}
.bar{display:flex;justify-content:center;gap:10px;padding:12px 10px 14px;flex-wrap:wrap}
.cb{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel2);color:var(--text);display:grid;place-items:center;position:relative}
.cb:hover{border-color:var(--vio)}
.cb.off{background:var(--danger);border-color:var(--danger);color:#fff}
.cb.on{background:var(--acid);border-color:var(--acid);color:var(--acid-ink)}
.cb.leave{background:var(--danger);border-color:var(--danger);width:76px;border-radius:27px;color:#fff}
.cb .badge{right:-2px;top:-2px;transform:none}
.reactpop{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--panel);border:1.5px solid var(--line);padding:8px;border-radius:18px;z-index:6}
.reactpop button{font-size:26px;width:46px;height:46px;border-radius:12px}
.reactpop button:hover{background:var(--panel2)}
.fl{position:absolute;bottom:96px;font-size:40px;pointer-events:none;animation:up 2.4s ease-out forwards;z-index:7}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-320px);opacity:0}}
.plist{display:flex;align-items:center;gap:10px;padding:6px}
.plist .mid{flex:1;min-width:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
#bgAnim{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#bgVid{position:fixed;right:4px;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#camVid{position:fixed;right:8px;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none}

#authroot{position:fixed;inset:0;z-index:200;background:radial-gradient(900px 500px at 80% 0%,rgba(157,92,255,.28),transparent 60%),var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.authbox{width:min(480px,100%);padding:26px;background:var(--panel);border:1.5px solid var(--line);border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.35)}
.authbox h1{font-size:30px;margin-bottom:8px}.authbox .tabs{display:flex;gap:6px;margin:18px 0}.authbox .tabs button{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:12px;color:var(--mute);font-weight:700}.authbox .tabs button.on{background:var(--acid);color:var(--acid-ink);border-color:var(--acid)}
.authbox .hint{font-size:12px;color:var(--mute)}
.authbox .err{color:var(--danger);font-size:13px;min-height:18px}
.profile-logout{margin-left:auto}
:root[data-theme="custom"]{--bg:var(--custom-bg,#12051f);--bg2:var(--custom-bg2,#1a0930);--panel:var(--custom-panel,#211040);--panel2:var(--custom-panel2,#2b1656);--line:var(--custom-line,#452387);--text:var(--custom-text,#f3ecff);--mute:var(--custom-mute,#a78fd6);--acid:var(--custom-accent,#c8ff1f);--acid-ink:var(--custom-ink,#14061f);--hi:var(--custom-accent,#c8ff1f);--vio:var(--custom-vio,#9d5cff);--vio-d:var(--custom-viod,#6a2bd9);--danger:var(--custom-danger,#ff4d8d);--bubble-in:var(--custom-bubble,#2b1656)}
</style>
</head>
<body>
<div id="authroot" hidden></div>
<div id="app">
  <aside id="rail"></aside>
  <main id="view"></main>
</div>
<div id="callroot" hidden></div>
<div id="modalroot"></div>
<div id="banner"></div>
<div id="toasts"></div>
<img id="bgAnim" alt="">
<video id="bgVid" muted loop playsinline></video>
<video id="camVid" muted playsinline></video>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script>
'use strict';
/* =====================================================================
   Утилиты
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=u=>/^data:image\/(png|jpeg|jpg|gif|webp|avif|bmp);base64,[A-Za-z0-9+/=]+$/i.test(u||'')?u:'';
const safeAud=u=>/^data:audio\/[a-z0-9.+-]+(;codecs=[^;,]+)?;base64,[A-Za-z0-9+/=]+$/i.test(u||'')?u:'';
const K=s=>String(s||'').replace(/[^A-Za-z0-9_-]/g,'_');
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
const fmtTime=ts=>{const d=new Date(ts);return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
const fmtDur=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const rid=(n=6)=>{const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<n;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const readDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});

const ICONS={
 mic:'<path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/>',
 'mic-off':'<path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.8"/><path d="M19 10v1a7 7 0 0 1-1.1 3.8M5 10v1a7 7 0 0 0 11 5.7M12 18v4M8 22h8M3 3l18 18"/>',
 video:'<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>',
 'video-off':'<path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.7 0H14a2 2 0 0 1 2 2v3.3l1 1L23 7v10M3 3l18 18"/>',
 screen:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
 hand:'<path d="M18 11V6a2 2 0 0 0-4 0M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3-2.6L8 15"/>',
 message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
 settings:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
 send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
 play:'<path d="M7 4l13 8-13 8V4z" fill="currentColor"/>',
 pause:'<path d="M8 4v16M16 4v16" stroke-width="4"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
 smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 back:'<path d="M15 18l-6-6 6-6"/>',
 volume:'<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
 invite:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

function toast(msg,kind){
  const el=document.createElement('div');el.className='toast'+(kind==='err'?' err':'');el.textContent=msg;
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),kind==='err'?6500:3200);
}
function openModal(html,cls=''){
  closeModal();
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet ${cls}" role="dialog" aria-modal="true"><button class="btn ghost sm x" data-act="closemodal" aria-label="Закрыть">${ic('x')}</button>${html}</div>`;
  $('#modalroot').appendChild(m);return m.firstChild;
}
function closeModal(){const r=$('#modalroot');if(r.firstChild){r.innerHTML='';SET.onClose&&SET.onClose();SET.onClose=null}}

/* =====================================================================
   Настройки (локально, только для этого устройства)
   ===================================================================== */
const SET_DEFAULT={mic:'',cam:'',spk:'',res:'720',fps:30,mirror:true,ns:true,ec:true,agc:true,
  bright:100,contrast:100,sat:100,bgMode:'none',bgId:'',blur:10,cut:'mask',
  mask:{size:1,soft:.55,x:0},chroma:{color:'#00ff00',tol:60,soft:40},theme:'auto',name:'','custom-bg':'#12051f','custom-panel':'#211040','custom-panel2':'#2b1656','custom-line':'#452387','custom-text':'#f3ecff','custom-mute':'#a78fd6','custom-accent':'#c8ff1f','custom-vio':'#9d5cff','custom-danger':'#ff4d8d'};
const S=(()=>{const s=LS.get('sig_settings',{});return {...SET_DEFAULT,...s,mask:{...SET_DEFAULT.mask,...(s.mask||{})},chroma:{...SET_DEFAULT.chroma,...(s.chroma||{})}}})();
const SET={tab:'dev',onClose:null,pick:false};
function saveS(){LS.set('sig_settings',S)}
function applyTheme(){if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=S.theme;for(const k of ['bg','panel','panel2','line','text','mute','accent','vio','danger']){const v=S['custom-'+k];if(v)document.documentElement.style.setProperty('--custom-'+k,v)}}
applyTheme();

/* IndexedDB: свои фоны для камеры */
const IDB={
  db:null,mem:[],
  open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{try{const r=indexedDB.open('signal-bg',1);r.onupgradeneeded=()=>r.result.createObjectStore('bg',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async tx(mode,fn){try{const db=await this.open();return await new Promise((res,rej)=>{const t=db.transaction('bg',mode);const st=t.objectStore('bg');const rq=fn(st);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}catch(e){return undefined}},
  async all(){const r=await this.tx('readonly',s=>s.getAll());return r||this.mem},
  async get(id){const r=await this.tx('readonly',s=>s.get(id));return r||this.mem.find(x=>x.id===id)},
  async put(rec){const r=await this.tx('readwrite',s=>s.put(rec));if(r===undefined)this.mem.push(rec)},
  async del(id){await this.tx('readwrite',s=>s.delete(id));this.mem=this.mem.filter(x=>x.id!==id)}
};

/* =====================================================================
   Медиа: камера, микрофон, обработка кадра, фоны
   ===================================================================== */
const M={raw:null,camOn:false,micStream:null,micTrack:null,micOn:true,screen:null,out:new MediaStream(),outTrack:null,
  canvas:document.createElement('canvas'),timer:0,devices:{mic:[],cam:[],spk:[]},an:null,level:0,bgEl:null,onChange:null,bgUrl:null};
M.ctx=M.canvas.getContext('2d');
const camVid=$('#camVid'),bgImg=$('#bgAnim'),bgVid=$('#bgVid');
let AC=null;
const getAC=()=>{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C()}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC};

function mediaErr(e,what){
  const n=e&&e.name;let m;
  if(n==='NotAllowedError'||n==='SecurityError')m=`Нет доступа к устройству (${what}). Разрешите доступ в браузере (значок замка у адреса). Если страница открыта во встроенном окне, попробуйте открыть её в отдельной вкладке.`;
  else if(n==='NotFoundError'||n==='OverconstrainedError')m=`Устройство не найдено (${what}). Проверьте подключение.`;
  else if(n==='NotReadableError')m=`Устройство занято другим приложением (${what}).`;
  else m=`Не получилось включить: ${what}. ${e&&e.message||''}`;
  toast(m,'err');
}
async function refreshDevices(){
  try{const ds=await navigator.mediaDevices.enumerateDevices();
    M.devices={mic:ds.filter(d=>d.kind==='audioinput'),cam:ds.filter(d=>d.kind==='videoinput'),spk:ds.filter(d=>d.kind==='audiooutput')}}catch(e){}
  if($('#devsel'))renderSettingsPanel();
  if($('.lobby'))lobbyFillSelects();
}
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',refreshDevices);

const RES={'360':[640,360],'480':[854,480],'720':[1280,720],'1080':[1920,1080]};
async function startCam(){
  stopCam(true);
  const [w,h]=RES[S.res]||RES['720'];
  const mk=id=>({video:{width:{ideal:w},height:{ideal:h},frameRate:{ideal:S.fps},...(id?{deviceId:{exact:id}}:{})},audio:false});
  try{M.raw=await navigator.mediaDevices.getUserMedia(mk(S.cam))}
  catch(e){if(S.cam&&(e.name==='OverconstrainedError'||e.name==='NotFoundError')){S.cam='';saveS();M.raw=await navigator.mediaDevices.getUserMedia(mk(''))}else throw e}
  camVid.srcObject=M.raw;await camVid.play().catch(()=>{});
  M.camOn=true;
  const t=M.raw.getVideoTracks()[0];if(t&&t.getSettings().deviceId&&!S.cam){/* оставляем «по умолчанию» */}
  rebuildOut();await refreshDevices();
}
function stopCam(silent){
  if(M.raw){M.raw.getTracks().forEach(t=>t.stop());M.raw=null}
  camVid.srcObject=null;M.camOn=false;clearInterval(M.timer);
  if(!silent&&!M.screen)setOutTrack(null);
}
async function startMic(){
  stopMic();
  const mk=id=>({audio:{echoCancellation:S.ec,noiseSuppression:S.ns,autoGainControl:S.agc,...(id?{deviceId:{exact:id}}:{})},video:false});
  try{M.micStream=await navigator.mediaDevices.getUserMedia(mk(S.mic))}
  catch(e){if(S.mic&&(e.name==='OverconstrainedError'||e.name==='NotFoundError')){S.mic='';saveS();M.micStream=await navigator.mediaDevices.getUserMedia(mk(''))}else throw e}
  M.micTrack=M.micStream.getAudioTracks()[0];M.micTrack.enabled=M.micOn;
  try{const ac=getAC();const src=ac.createMediaStreamSource(M.micStream);M.an=ac.createAnalyser();M.an.fftSize=512;src.connect(M.an)}catch(e){M.an=null}
  M.onChange&&M.onChange();await refreshDevices();
}
function stopMic(){
  if(M.micStream){M.micStream.getTracks().forEach(t=>t.stop())}
  M.micStream=null;M.micTrack=null;M.an=null;M.level=0;
}
const needCanvas=()=>S.bgMode!=='none'||S.bright!==100||S.contrast!==100||S.sat!==100;
let canvasTrack=null;
function rebuildOut(){
  clearInterval(M.timer);let track=null;
  if(M.screen){track=M.screen.getVideoTracks()[0]}
  else if(M.raw){
    if(needCanvas()){
      if(!canvasTrack){canvasTrack=M.canvas.captureStream(30).getVideoTracks()[0]}
      drawFrame();M.timer=setInterval(drawFrame,1000/Math.min(S.fps||30,30));track=canvasTrack;
    }else track=M.raw.getVideoTracks()[0];
  }
  setOutTrack(track);
}
function setOutTrack(track){
  if(track===M.outTrack){attachPreviews();return}
  M.outTrack=track;
  M.out.getVideoTracks().forEach(t=>M.out.removeTrack(t));
  if(track)M.out.addTrack(track);
  attachPreviews();M.onChange&&M.onChange();
}
function attachPreviews(){
  $$('video[data-pv]').forEach(v=>{
    if(v.srcObject!==M.out)v.srcObject=M.out;
    v.muted=true;v.play&&v.play().catch(()=>{});
    v.classList.toggle('mir',!!S.mirror&&!M.screen);
    const b=v.closest('.pvbox');if(b)b.classList.toggle('empty',!M.outTrack);
  });
}
/* уровень микрофона */
setInterval(()=>{
  if(!M.an){M.level=0}else{const b=new Uint8Array(M.an.fftSize);M.an.getByteTimeDomainData(b);let s=0;for(const v of b){const x=(v-128)/128;s+=x*x}M.level=Math.sqrt(s/b.length)}
  const w=Math.min(100,M.level*380)+'%';
  $$('[data-meter] i').forEach(i=>i.style.width=w);
},90);

/* --- фоны --- */
const PRESETS={
 acid:{n:'Кислота',draw(x,W,H){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#3a0ca3');g.addColorStop(.55,'#8a2be2');g.addColorStop(1,'#c8ff1f');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='rgba(200,255,31,.16)';for(let i=0;i<8;i++){x.beginPath();x.arc(W*(.08+i*.13),H*(.15+.7*((i*37)%10)/10),H*(.07+.03*(i%3)),0,7);x.fill()}}},
 grid:{n:'Сетка',draw(x,W,H){x.fillStyle='#12051f';x.fillRect(0,0,W,H);const hz=H*.5;const g=x.createLinearGradient(0,hz,0,H);g.addColorStop(0,'#3a0ca3');g.addColorStop(1,'#12051f');x.fillStyle=g;x.fillRect(0,hz,W,H-hz);x.strokeStyle='#c8ff1f';x.lineWidth=2;x.globalAlpha=.7;for(let i=-14;i<=14;i++){x.beginPath();x.moveTo(W/2+i*40,hz);x.lineTo(W/2+i*220,H);x.stroke()}for(let j=0;j<9;j++){const y=hz+Math.pow(j/9,2)*(H-hz);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}x.globalAlpha=1;const s=x.createRadialGradient(W/2,hz,10,W/2,hz,H*.5);s.addColorStop(0,'rgba(200,255,31,.9)');s.addColorStop(1,'rgba(200,255,31,0)');x.fillStyle=s;x.fillRect(0,0,W,H)}},
 blobs:{n:'Пятна',draw(x,W,H){x.fillStyle='#1a0930';x.fillRect(0,0,W,H);const b=(cx,cy,r,c)=>{const g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)};b(W*.2,H*.3,H*.7,'rgba(157,92,255,.95)');b(W*.8,H*.7,H*.7,'rgba(200,255,31,.75)');b(W*.6,H*.1,H*.5,'rgba(106,43,217,.9)')}},

 night:{n:'Ночь',draw(x,W,H){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d0417');g.addColorStop(1,'#3b1580');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<120;i++){const px=(i*9301+49297)%233280/233280*W,py=(i*4211+7919)%233280/233280*H*.85;x.fillStyle=i%9?'rgba(243,236,255,.8)':'#c8ff1f';x.beginPath();x.arc(px,py,i%9?1.4:2.6,0,7);x.fill()}x.fillStyle='#c8ff1f';x.beginPath();x.arc(W*.82,H*.2,H*.07,0,7);x.fill();x.fillStyle='#0d0417';x.beginPath();x.arc(W*.85,H*.18,H*.065,0,7);x.fill()}},

const adjFilter=()=>(S.bright!==100||S.contrast!==100||S.sat!==100)?`brightness(${S.bright}%) contrast(${S.contrast}%) saturate(${S.sat}%)`:'none';
function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255]}
function drawFrame(){
  const v=camVid;if(!M.raw||v.readyState<2||!v.videoWidth)return;

  const f=adjFilter(),mode=S.bgMode;
  if(mode==='none'){x.filter=f;x.drawImage(v,0,0,W,H);x.filter='none';return}
  if(mode==='blur'){

  }else{

    const sw=Math.min(480,W),sh=Math.round(sw*H/W);if(smallC.width!==sw||smallC.height!==sh){smallC.width=sw;smallC.height=sh}

    const id=sctx.getImageData(0,0,sw,sh),d=id.data,k=hexRgb(S.chroma.color),tol=S.chroma.tol*4.4,soft=Math.max(1,S.chroma.soft*2.2);
    for(let i=0;i<d.length;i+=4){const dr=d[i]-k[0],dg=d[i+1]-k[1],db=d[i+2]-k[2],dist=Math.sqrt(dr*dr+dg*dg+db*db);d[i+3]=dist<tol?0:dist>tol+soft?255:((dist-tol)/soft*255)|0}

}

function beepURL(){
  const sr=22050,n=Math.floor(sr*1.0),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const t=i/sr,seg=t<.3?523:t<.6?659:784,env=Math.min(1,(t%.3)*40)*Math.max(0,1-(t%.3)/.3*0.6);v.setInt16(44+i*2,Math.sin(2*Math.PI*seg*t)*env*12000,true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

/* изображения: png/jpg/gif/webp… */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Не удалось прочитать изображение'))};i.src=u})}
async function prepImage(file,{maxW,maxH,maxGif}){
  if(!file||!/^image\//.test(file.type)&&!/\.(png|jpe?g|gif|webp|avif|bmp)$/i.test(file.name))throw new Error('Выберите изображение: jpg, png, gif, webp');
  if(/svg/i.test(file.type))throw new Error('SVG не поддерживается — используйте png, jpg, gif или webp');
  const isGif=file.type==='image/gif'||/\.gif$/i.test(file.name);
  if(isGif){if(file.size>maxGif)throw new Error(`GIF слишком тяжёлый (${Math.round(file.size/1024)} КБ). Максимум — ${Math.round(maxGif/1024)} КБ`);return readDataURL(file)}
  const img=await loadImg(file);
  if(file.size<=300*1024&&img.naturalWidth<=maxW&&img.naturalHeight<=maxH&&/^image\/(png|jpeg|webp)$/.test(file.type))return readDataURL(file);
  const k=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  const alpha=/png|webp/.test(file.type);
  let out=c.toDataURL(alpha?'image/webp':'image/jpeg',.86);if(!/^data:image\/(webp|jpeg)/.test(out))out=c.toDataURL('image/png');
  return out;
}

async function onSetChange(e,isChange){
  const el=e.target;if(!el.dataset||!el.dataset.set)return;

  setPath(key,val);saveS();
  const out=$(`[data-out="${key}"]`);if(out)out.textContent=val+(el.dataset.unit||'');
  if(key==='theme')applyTheme();

}

/* --- участники --- */
function onPeers(ch){
  const present=new Set();
  for(const p of ch.peers){
    const inf=p.presence||{},sid=inf.sid;if(!sid||sid===C.sid||typeof sid!=='string')continue;
    present.add(sid);C.labels.set(p.peer,sid);
    let rp=C.peers.get(sid);
    if(!rp)rp=addPeer(sid,inf);else{rp.info=inf;updateTile(sid)}
  }
  for(const sid of [...C.peers.keys()])if(!present.has(sid))removePeer(sid);
  renderPeopleIfOpen();layoutGrid();
}
function addPeer(sid,inf){
  const rp={sid,info:inf,polite:C.sid<sid,making:false,ignore:false,pending:[],parts:new Map(),stream:null,pc:null};
  C.peers.set(sid,rp);createPC(rp);ensureTile(sid);updateTile(sid);
  const early=C.early[sid];if(early){delete C.early[sid];early.forEach(d=>onSigData(d))}
  return rp;
}
function createPC(rp){
  const pc=new RTCPeerConnection({iceServers:ICE});rp.pc=pc;
  const at=pc.addTransceiver('audio',{direction:'sendrecv'}),vt=pc.addTransceiver('video',{direction:'sendrecv'});
  rp.aS=at.sender;rp.vS=vt.sender;
  if(M.micTrack)at.sender.replaceTrack(M.micTrack).catch(()=>{});
  if(M.outTrack)vt.sender.replaceTrack(M.outTrack).catch(()=>{});
  pc.onicecandidate=e=>{if(e.candidate)sendSig({t:'c',to:rp.sid,c:e.candidate.toJSON()})};
  pc.ontrack=e=>{
    if(!rp.stream)rp.stream=new MediaStream();
    if(!rp.stream.getTracks().includes(e.track))rp.stream.addTrack(e.track);
    attachRemote(rp);if(e.track.kind==='audio')watchSpeaking(rp.sid,rp.stream);
  };
  pc.onnegotiationneeded=async()=>{
    try{rp.making=true;await pc.setLocalDescription();sendDesc(rp,pc.localDescription)}catch(e){console.warn(e)}finally{rp.making=false}
  };
  pc.oniceconnectionstatechange=()=>{
    if(pc.iceConnectionState==='failed'&&pc.restartIce)pc.restartIce();
    const t=C.tiles&&C.tiles.get(rp.sid);if(t)t.classList.toggle('conn',!['connected','completed'].includes(pc.iceConnectionState));
  };
}
function removePeer(sid){

  const sp=C.speak.get(sid);if(sp){clearInterval(sp.iv);C.speak.delete(sid)}
  layoutGrid();
}
/* --- сигналинг --- */
const SQ=[];let sqBusy=false;
function sendSig(d){SQ.push({...d,from:C.sid});if(!sqBusy){sqBusy=true;pumpSig()}}
async function pumpSig(){
  while(SQ.length){const d=SQ.shift();try{if(C.active)await C.named.emit('sig',d)}catch(e){}await sleep(22)}
  sqBusy=false;
}
function sendDesc(rp,desc){
  const s=JSON.stringify({type:desc.type,sdp:desc.sdp}),id=rid(6),n=Math.ceil(s.length/2000);
  for(let i=0;i<n;i++)sendSig({t:'d',to:rp.sid,id,i,n,p:s.slice(i*2000,(i+1)*2000)});
}
function onSig(m){onSigData(m.data)}
function onSigData(d){
  if(!d||typeof d!=='object'||d.to!==C.sid||typeof d.from!=='string'||d.from===C.sid)return;
  const rp=C.peers.get(d.from);
  if(!rp){(C.early[d.from]=C.early[d.from]||[]).push(d);if(C.early[d.from].length>60)C.early[d.from].shift();return}
  if(d.t==='d'){
    if(typeof d.p!=='string'||!Number.isInteger(d.i)||!Number.isInteger(d.n)||d.n<1||d.n>24||d.i<0||d.i>=d.n)return;
    let a=rp.parts.get(d.id);if(!a){a=new Array(d.n);a.got=0;rp.parts.set(d.id,a)}
    if(a[d.i]==null){a[d.i]=d.p;a.got++}
    if(a.got===d.n){rp.parts.delete(d.id);let desc;try{desc=JSON.parse(a.join(''))}catch(e){return}handleDesc(rp,desc)}
  }else if(d.t==='c')handleCand(rp,d.c);
}
async function handleDesc(rp,desc){
  const pc=rp.pc;if(!pc||!desc||!['offer','answer'].includes(desc.type)||typeof desc.sdp!=='string')return;
  try{
    const collision=desc.type==='offer'&&(rp.making||pc.signalingState!=='stable');
    rp.ignore=!rp.polite&&collision;if(rp.ignore)return;
    await pc.setRemoteDescription({type:desc.type,sdp:desc.sdp});
    for(const c of rp.pending.splice(0))await pc.addIceCandidate(c).catch(()=>{});
    if(desc.type==='offer'){await pc.setLocalDescription();sendDesc(rp,pc.localDescription)}
  }catch(e){console.warn('desc',e)}
}
async function handleCand(rp,c){
  const pc=rp.pc;if(!pc||!c||typeof c!=='object')return;
  if(!pc.remoteDescription){rp.pending.push(c);return}
  try{await pc.addIceCandidate(c)}catch(e){if(!rp.ignore)console.warn('cand',e)}
}

function watchSpeaking(id,stream){

  try{const ac=getAC(),an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(stream).connect(an);C.speak.set(id,{an,buf:new Uint8Array(256)})}catch(e){}

function pollSpeaking(){
  if(!C.active)return;
  for(const [id,sp] of C.speak){sp.an.getByteTimeDomainData(sp.buf);let s=0;for(const v of sp.buf){const x=(v-128)/128;s+=x*x}const on=Math.sqrt(s/sp.buf.length)>.03;const t=C.tiles.get(id);if(t)t.classList.toggle('speak',on)}

async function postMessage(payload){

    await APP.db.doc('chats/'+id).set({members:[APP.uid,CH.open.peer],updatedAt:ts,last:{from:APP.uid,ts,...prev}});
    if(CH.open&&CH.open.id===id)CH.open.draft=false;
  }catch(e){toast('Не удалось отправить сообщение. Возможно, у аккаунта нет права записи на этой странице.','err')}
}
/* --- голосовые сообщения --- */
const VR={rec:null,chunks:[],stream:null,t0:0,peaks:[],iv:0,an:null,cancelled:false};
async function startRecording(){
  if(!window.MediaRecorder){toast('Ваш браузер не поддерживает запись голоса','err');return}
  try{VR.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:S.ec,noiseSuppression:S.ns,...(S.mic?{deviceId:{ideal:S.mic}}:{})}})}
  catch(e){mediaErr(e,'микрофон');return}
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  VR.chunks=[];VR.peaks=[];VR.cancelled=false;
  try{VR.rec=new MediaRecorder(VR.stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:24000})}catch(e){VR.rec=new MediaRecorder(VR.stream)}
  VR.rec.ondataavailable=e=>{if(e.data.size)VR.chunks.push(e.data)};
  VR.rec.onstop=finishRecording;
  try{const ac=getAC(),src=ac.createMediaStreamSource(VR.stream);VR.an=ac.createAnalyser();VR.an.fftSize=512;src.connect(VR.an)}catch(e){VR.an=null}
  VR.rec.start(250);VR.t0=Date.now();
  const comp=$('#composer');comp.innerHTML=`<button type="button" class="round" data-act="reccancel" aria-label="Отменить">${ic('trash')}</button><div class="rec"><i class="rd"></i><span id="rectime">0:00</span><div class="wave" id="recwave"></div></div><button type="button" class="round acid" data-act="recsend" aria-label="Отправить голосовое">${ic('send')}</button>`;
  VR.iv=setInterval(()=>{
    const s=(Date.now()-VR.t0)/1000;const t=$('#rectime');if(t)t.textContent=fmtDur(s);
    let lv=0;if(VR.an){const b=new Uint8Array(VR.an.fftSize);VR.an.getByteTimeDomainData(b);let q=0;for(const v of b){const x=(v-128)/128;q+=x*x}lv=Math.sqrt(q/b.length)}
    VR.peaks.push(lv);const w=$('#recwave');if(w){const last=VR.peaks.slice(-28);w.innerHTML=last.map(p=>`<i style="height:${4+Math.min(24,p*180)}px"></i>`).join('')}
    if(s>=45)stopRecording(false);
  },100);
}
function stopRecording(cancel){VR.cancelled=!!cancel;clearInterval(VR.iv);if(VR.rec&&VR.rec.state!=='inactive')VR.rec.stop();else finishRecording()}
async function finishRecording(){
  clearInterval(VR.iv);if(VR.stream){VR.stream.getTracks().forEach(t=>t.stop());VR.stream=null}
  const dur=(Date.now()-VR.t0)/1000,chunks=VR.chunks,mime=(VR.rec&&VR.rec.mimeType)||'audio/webm';VR.rec=null;
  renderConv();
  if(VR.cancelled||!chunks.length)return;
  if(dur<.6){toast('Слишком короткое сообщение');return}
  const blob=new Blob(chunks,{type:mime});let url=await readDataURL(blob);
  url=url.replace(/^data:([^;,]*)(;[^,]*)?;base64,/,(m,a,b)=>`data:${(a||'audio/webm').split(';')[0]}${b&&b.includes('codecs')?b:''};base64,`);
  if(url.length>235000){toast('Голосовое получилось слишком большим — запишите покороче','err');return}
  const N=36,pk=VR.peaks.length?VR.peaks:[0],mx=Math.max(...pk,.02);let wave='';
  for(let i=0;i<N;i++){const a=Math.floor(i*pk.length/N),z=Math.max(a+1,Math.floor((i+1)*pk.length/N));let m=0;for(let j=a;j<z&&j<pk.length;j++)m=Math.max(m,pk[j]);wave+=Math.min(9,Math.round(m/mx*9))}
  await postMessage({type:'voice',audio:url,dur:Math.round(dur*10)/10,wave});
}

const VP={id:null,audio:null,paintBars(){
  const box=$(`[data-vid="${CSS.escape(VP.id||'')}"]`);$$('.voice').forEach(v=>{const on=v===box;const btn=v.querySelector('.pl');btn.innerHTML=ic(on&&VP.audio&&!VP.audio.paused?'pause':'play');const bars=v.querySelectorAll('.wave i');const p=on&&VP.audio&&VP.audio.duration?VP.audio.currentTime/VP.audio.duration:0;bars.forEach((b,i)=>b.classList.toggle('on',i<p*bars.length))})}};
function playVoice(id){
  if(VP.id===id&&VP.audio){VP.audio.paused?VP.audio.play():VP.audio.pause();VP.paintBars();return}
  stopVoicePlay();const m=CH.msgs.find(x=>x.id===id);if(!m)return;const src=safeAud(m.audio);if(!src){toast('Не удалось воспроизвести','err');return}
  const a=new Audio(src);applySink(a);VP.id=id;VP.audio=a;

  a.play().catch(()=>toast('Не удалось воспроизвести','err'));
}

async function uploadBg(){
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;inp.accept='image/*,video/mp4,video/webm,.gif';
  inp.onchange=async()=>{
    let last=null;
    for(const f of inp.files){
      if(!/^(image|video)\//.test(f.type)&&!/\.(png|jpe?g|gif|webp|avif|bmp|mp4|webm)$/i.test(f.name)){toast(`«${f.name}» — неподдерживаемый формат`,'err');continue}
      if(f.size>40*1024*1024){toast(`«${f.name}» слишком большой (максимум 40 МБ)`,'err');continue}
      const rec={id:'b'+Date.now().toString(36)+rid(3),name:f.name,type:f.type||(/\.gif$/i.test(f.name)?'image/gif':'image/png'),blob:f,ts:Date.now()};
      await IDB.put(rec);last=rec;
    }
    if(last){S.bgId='u:'+last.id;saveS();await applyBg();toast('Фон добавлен')}

function pickChroma(e){
  const box=e.target.closest('[data-pvbox]');if(!M.raw||!camVid.videoWidth){SET.pick=false;return}
  const r=box.getBoundingClientRect(),vw=camVid.videoWidth,vh=camVid.videoHeight;
  const k=Math.min(r.width/vw,r.height/vh),dw=vw*k,dh=vh*k,ox=(r.width-dw)/2,oy=(r.height-dh)/2;
  let x=(e.clientX-r.left-ox)/dw,y=(e.clientY-r.top-oy)/dh;if(S.mirror&&!M.screen)x=1-x;
  if(x<0||x>1||y<0||y>1)return;
  const c=document.createElement('canvas');c.width=c.height=5;const cx=c.getContext('2d');
  cx.drawImage(camVid,Math.max(0,x*vw-2),Math.max(0,y*vh-2),5,5,0,0,5,5);
  const d=cx.getImageData(0,0,5,5).data;let R=0,G=0,B=0;for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2]}
  const n=d.length/4,hx=v=>Math.round(v/n).toString(16).padStart(2,'0');
  S.chroma.color='#'+hx(R)+hx(G)+hx(B);SET.pick=false;saveS();renderSettingsPanel();toast('Цвет фона выбран');
}

/* =====================================================================
   Firebase: аккаунты username/password без показа почты пользователю
   ===================================================================== */
const FIREBASE_CONFIG={
  apiKey:'PASTE_API_KEY',
  authDomain:'PASTE_PROJECT.firebaseapp.com',
  projectId:'PASTE_PROJECT_ID',
  storageBucket:'PASTE_PROJECT.appspot.com',
  messagingSenderId:'PASTE_SENDER_ID',
  appId:'PASTE_APP_ID'
};
const FIREBASE_READY=FIREBASE_CONFIG.apiKey&&!FIREBASE_CONFIG.apiKey.startsWith('PASTE_')&&window.firebase;
let FB=null;
function usernameEmail(u){return `${u.toLowerCase()}@signal.local`}
function authError(e){const m={'auth/invalid-credential':'Неверный логин или пароль.','auth/user-not-found':'Пользователь не найден.','auth/wrong-password':'Неверный пароль.','auth/weak-password':'Пароль должен содержать минимум 6 символов.','auth/email-already-in-use':'Такой логин уже зарегистрирован.','auth/too-many-requests':'Слишком много попыток. Попробуйте позже.'};return m[e&&e.code]||'Не удалось выполнить действие.'}
function openAuth(mode='login'){
  if(!FIREBASE_READY){toast('Сначала вставьте Firebase-конфигурацию в HTML','err');return}
  const root=$('#authroot');root.hidden=false;root.innerHTML=`<div class="authbox"><div class="brand" style="padding:0 0 10px"><span class="logo"><i></i><i></i><i></i><i></i></span>Сигнал</div><h1>${mode==='register'?'Создать аккаунт':'Войти'}</h1><p class="mute">Только логин и пароль. Почта и телефон не нужны.</p><div class="tabs"><button class="${mode==='login'?'on':''}" data-auth-mode="login">Вход</button><button class="${mode==='register'?'on':''}" data-auth-mode="register">Регистрация</button></div><form class="stack" id="authform"><label class="f">Логин<input id="authuser" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" autocapitalize="off" spellcheck="false"></label><label class="f">Пароль<input id="authpass" required minlength="6" maxlength="128" type="password" autocomplete="${mode==='register'?'new-password':'current-password'}"></label><div class="hint">Логин станет неизменяемым @юзернеймом. Пароль после регистрации тоже не меняется.</div><div class="err" id="autherr"></div><button class="btn xl">${mode==='register'?'Зарегистрироваться':'Войти'}</button></form></div>`;
  root.dataset.mode=mode;
}
async function authSubmit(e){
  e.preventDefault();const mode=$('#authroot').dataset.mode,u=$('#authuser').value.trim().toLowerCase(),pw=$('#authpass').value;const err=$('#autherr');
  if(!/^[a-z0-9_]{3,24}$/.test(u)){err.textContent='Логин: 3–24 символа, только латиница, цифры и _. ';return}
  if(pw.length<6){err.textContent='Пароль должен быть не короче 6 символов.';return}
  try{
    if(mode==='register'){
      const taken=await FB.db.doc('usernames/'+u).get();if(taken.exists){err.textContent='Этот логин уже занят.';return}
      const cred=await FB.auth.createUserWithEmailAndPassword(usernameEmail(u),pw);
      await FB.db.doc('usernames/'+u).set({uid:cred.user.uid});
      await FB.db.doc('profiles/'+K(cred.user.uid)).set({uid:cred.user.uid,name:u,username:u,bio:'',avUrl:'',bnUrl:'',createdAt:Date.now(),updated:Date.now()});
    }else await FB.auth.signInWithEmailAndPassword(usernameEmail(u),pw);
  }catch(x){err.textContent=authError(x)}
}
function initFirebase(){
  if(!FIREBASE_READY)return false;
  FB=firebase.initializeApp(FIREBASE_CONFIG);FB.auth=firebase.auth();FB.db=firebase.firestore();FB.storage=firebase.storage();
  APP.auth=FB.auth;APP.db=FB.db;APP.storage=FB.storage;APP.cloud=true;
  return true;
}
function makeRoomAdapter(){
  return {join:async(code)=>{
    const base=FB.db.collection('calls').doc(K(code));
    const sid=rid(10);
    const presence=base.collection('participants');
    const signals=base.collection('signals');const events=base.collection('events');
    const unsubs=[];
    const api={
      presence:async(data)=>presence.doc(sid).set({...data,uid:APP.uid,updatedAt:Date.now()},{merge:true}),
      emit:async(type,data)=>{if(type==='sig')return signals.add({...data,ts:Date.now()});return events.add({type,data,ts:Date.now()})},
      on:(type,cb)=>{const q=type==='sig'?signals.where('to','==',sid):events.where('type','==',type);let first=true;return q.onSnapshot(s=>{s.docChanges().forEach(ch=>{if(ch.type==='added'){if(first&&Date.now()-((ch.doc.data()||{}).ts||0)>120000)return;const d=ch.doc.data();cb(type==='sig'?{data:d}: {data:d.data})}});first=false})},
      onPeers:(cb)=>presence.onSnapshot(s=>cb({peers:s.docs.map(d=>({peer:d.id,presence:d.data()}))})),
      leave:async()=>{for(const u of unsubs){try{u()}catch(e){}}await presence.doc(sid).delete().catch(()=>{})}
    };
    api._sid=sid;api._unsubs=unsubs;
    return api;
  }};
}
function attachFirebaseAuth(){
  FB.auth.onAuthStateChanged(async user=>{
    if(!user){APP.uid=null;APP.cloud=false;$('#authroot').hidden=false;openAuth('login');renderNav();return}
    APP.uid=user.uid;APP.cloud=true;APP.db=FB.db;APP.storage=FB.storage;APP.room=makeRoomAdapter();
    const p=await FB.db.doc('profiles/'+K(user.uid)).get();APP.myName=(p.exists&&p.data().name)||user.email.split('@')[0];
    watchProfile(user.uid);startChatList();$('#authroot').hidden=true;renderNav();if(APP.view==='home')viewHome();
  });
}
/* =====================================================================
   Запуск
   ===================================================================== */
const useCap=n=>{try{return window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
(async function boot(){
  renderNav();viewHome();await applyBg();
  if(!initFirebase()){openAuth('login');toast('Настройте Firebase-конфигурацию в этом файле, чтобы включить аккаунты и работу между устройствами.','err');return}
  attachFirebaseAuth();
})();
